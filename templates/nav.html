<div
	class="modal fade"
	id="subsModal"
	tabindex="-1"
	aria-labelledby="subsModalLabel"
	aria-hidden="true"
>
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="subsModalLabel">
					Subtitles Settings
				</h5>
				<button
					type="button"
					class="btn-close"
					data-bs-dismiss="modal"
					aria-label="Close"
				></button>
			</div>
			<div class="modal-body">
				<div class="mb-3">
					<label for="fontSelect">Select font</label>
					<select
						id="fontSelect"
						class="form-select form-select-lg mb-3"
					>
						<option disabled>Loading fonts...</option>
					</select>
				</div>
				<div id="resultColor" class="mb-3">
					<p
						style="font-size: 26px"
						contenteditable="true"
						id="demoText"
					>
						This is an Example Text with @highlight@ . Edit it
					</p>
				</div>

				<div class="row border border-success p-2 border-opacity-10">
					<div class="w-50">
						<label for="colorInput" class="form-label">Font</label>
						<input
							id="colorInput"
							class="form-control form-control-color"
							data-jscolor="{ value: '#33AACC80', backgroundColor: '#333', shadowColor: '#FFFFFF80', width: 250, height: 250 }"
						/>
					</div>
					<div class="w-50">
						<label for="fontsize" class="form-label"> </label>
						<select id="fontsize" class="form-select"></select>
					</div>
				</div>
				<div class="row border border-success p-2 border-opacity-10">
					<!-- Outline color + outline size -->

					<div class="w-50">
						<label for="outlineColorInput" class="form-label"
							>Outline</label
						>
						<input
							id="outlineColorInput"
							class="form-control form-control-color"
							data-jscolor="{ value: '#33AACC90', backgroundColor: '#333', shadowColor: '#FFFFFF90', width: 250, height: 250 }"
						/>
					</div>
					<div class="w-50">
						<label for="outline" class="form-label"> </label>
						<select id="outline" class="form-select"></select>
					</div>
				</div>
				<div class="row border border-success p-2 border-opacity-10">
					<div class="w-25">
						<div class="mb-3">
							<label for="highlightColorInput" class="form-label"
								>Highlight</label
							>
							<input
								id="highlightColorInput"
								class="form-control form-control-color"
								data-jscolor="{ value: '#DB18FF', backgroundColor: '#333', shadowColor: '#FFFFFF', width: 250, height: 250 }"
							/>
						</div>
					</div>
					<div class="w-75">
						<div class="mb-3" id="htype">
							<div class="mb-3">
								<label class="form-label"> </label>
							</div>

							<div class="btn-group" role="group">
								<input
									type="radio"
									class="btn-check"
									name="options"
									id="hcolor"
									autocomplete="off"
									checked
								/>
								<label class="btn btn-primary" for="hcolor"
									>Color</label
								>

								<input
									type="radio"
									class="btn-check"
									name="options"
									id="hbox"
									autocomplete="off"
								/>
								<label class="btn btn-primary" for="hbox"
									>Box</label
								>

								<input
									type="radio"
									class="btn-check"
									name="options"
									id="hnone"
									autocomplete="off"
								/>
								<label class="btn btn-primary" for="hnone"
									>None</label
								>
							</div>
						</div>
					</div>
				</div>

				<div class="mb-3 form-check form-switch">
					<input
						type="checkbox"
						name="caps"
						id="caps"
						class="form-check-input"
					/>
					<label for="caps" class="form-check-label">CAPS</label>
				</div>

				<!-- Generate Button -->
				<div class="mb-3">
					<button id="saveCfg" class="btn btn-primary">
						Save Changes
					</button>
				</div>

				<!-- Display Result -->
				<div class="mb-3">
					<label for="result" class="form-label">Action</label>
					<input
						type="text"
						id="result"
						class="form-control"
						readonly
					/>
				</div>
			</div>
		</div>
	</div>
</div>
